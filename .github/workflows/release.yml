name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Verify tag matches Cargo.toml
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "$tag" != "$version" ]; then
            echo "::error::标签是 ${GITHUB_REF_NAME}，但 Cargo.toml 版本是 $version"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          set -euo pipefail
          target=x86_64-unknown-linux-gnu
          asset="embydown-${GITHUB_REF_NAME}-${target}"
          mkdir -p "dist/${asset}"
          cp target/release/embydown "dist/${asset}/"
          cp README.md CHANGELOG.md install.sh "dist/${asset}/"
          tar -C dist -czf "dist/${asset}.tar.gz" "${asset}"
          ( cd dist && sha256sum "${asset}.tar.gz" > "${asset}.tar.gz.sha256" )

          # install.sh 用的稳定文件名：始终指向 latest release
          cp "dist/${asset}.tar.gz" "dist/embydown-${target}.tar.gz"
          ( cd dist && sha256sum "embydown-${target}.tar.gz" > "embydown-${target}.tar.gz.sha256" )

          # 自更新（embydown update）用的裸二进制，无需解包
          cp target/release/embydown "dist/embydown-${GITHUB_REF_NAME}-${target}.bin"
          ( cd dist && sha256sum "embydown-${GITHUB_REF_NAME}-${target}.bin" > "embydown-${GITHUB_REF_NAME}-${target}.bin.sha256" )
          cp target/release/embydown "dist/embydown-${target}.bin"
          ( cd dist && sha256sum "embydown-${target}.bin" > "embydown-${target}.bin.sha256" )

          ls -lh dist/

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          PREV="$prev" python3 - <<'PY'
          import os
          import re

          version = os.environ["VERSION"].removeprefix("v")
          repo = os.environ["REPO"]
          prev = os.environ.get("PREV", "")

          text = open("CHANGELOG.md", encoding="utf-8").read()
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, text, re.M | re.S)
          if not match:
              raise SystemExit(f"CHANGELOG.md 中找不到版本 {version} 的章节")

          body = match.group(1).strip()
          body += "\n\n"
          if prev:
              body += f"**Full Changelog**: https://github.com/{repo}/compare/{prev}...v{version}\n"
          body += f"**完整变更记录**: https://github.com/{repo}/blob/main/CHANGELOG.md\n"
          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(body)
          PY

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.3
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/embydown-v*-x86_64-unknown-linux-gnu.bin
            dist/embydown-x86_64-unknown-linux-gnu.bin
            install.sh
